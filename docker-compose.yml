version: '3.8'

services:
  db-mysql:
    image: mysql:8.0
    container_name: school_routes_db
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: school_routes
      MYSQL_USER: routes_user
      MYSQL_PASSWORD: user_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  api-spring:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: acb_admin_lo_api
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db-mysql:3306/school_routes?allowPublicKeyRetrieval=true&useSSL=false
      - SPRING_DATASOURCE_USERNAME=routes_user
      - SPRING_DATASOURCE_PASSWORD=user_password
    volumes:
      - .:/app
      - ~/.m2:/root/.m2
    depends_on:
      - db-mysql
    networks:
      default: {}
      acb-net:
        aliases:
          - admin-api

volumes:
  mysql_data:

networks:
  acb-net:
    external: true
    name: acb-net
